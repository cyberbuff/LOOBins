name: fileproviderctl
author: Hare Sudhan (@cyb3rbuff)
short_description: Introspect and control the File Provider daemon that backs macOS cloud-sync clients.
full_description: "The fileproviderctl binary controls the fileproviderd daemon and enumerates and manipulates files exposed through File Provider extensions. On modern macOS, every third-party cloud-sync client (Dropbox, OneDrive, Google Drive, Box) and iCloud Drive registers a File Provider domain, and items in those domains can be dataless placeholders that hold metadata but no local contents. fileproviderctl reads and acts on this subsystem from the logged-in user's session with no elevation. That makes it attractive to an attacker with code execution as the user. The dump command reveals which cloud services the victim syncs and the state of the sync engine, enumerate lists the items in a provider domain including cloud-only placeholders, and materialize forces a placeholder's contents to be written to disk. Together these let an attacker inventory and pull down cloud-stored data without opening the sync applications or their GUIs."
created: 2026-09-20
example_use_cases:
  - name: Discover configured cloud storage providers via the subsystem dump
    description: The dump command dumps the state of the File Provider subsystem, the sync engine, and all providers. The output reveals which cloud-sync services are registered as provider domains on the host (for example Dropbox, OneDrive, Google Drive, Box, or iCloud Drive) along with provider identifiers and sync-engine metadata, telling an attacker where the victim's cloud-synced data lives before any files are touched. It runs from the logged-in user's session and requires no elevation or sudo.
    code: fileproviderctl dump
    tactics:
      - Discovery
    tags: []
  - name: Enumerate items in a cloud provider domain including placeholders
    description: The enumerate command (alias ls) runs an interactive enumeration of the specified provider, taking a partial provider identifier obtained from the dump output. It lists the items in that provider domain, including dataless placeholder items whose contents are not present on disk, letting an attacker inventory cloud-stored filenames and structure without downloading the data or triggering the sync client UI.
    code: fileproviderctl enumerate <PROVIDER_ID>
    tactics:
      - Discovery
    tags:
      - enumeration
  - name: Materialize a cloud-only placeholder file to disk for collection
    description: The materialize command causes the specified item to be written on disk and lists the resulting contents. A dataless placeholder is a cloud-backed file with metadata but no local data; materialize forces its contents to download to the local filesystem. Combined with the item paths gathered from enumerate, an attacker can pull cloud-stored files that were never local onto disk and stage them for exfiltration, without opening the sync application. It takes a file URL, path, or bookmark and runs as the logged-in user with no elevation.
    code: fileproviderctl materialize <FILE_PATH>
    tactics:
      - Collection
    tags: []
paths:
  - /usr/bin/fileproviderctl
detections:
  - name: "Process execution of /usr/bin/fileproviderctl; the tool is an introspection utility rarely run interactively by end users, so most executions warrant review of the invoking process lineage."
    url: "N/A"
  - name: "Endpoint Security exec events (ES_EVENT_TYPE_NOTIFY_EXEC) for /usr/bin/fileproviderctl with the dump, enumerate, ls, or materialize subcommand in the process arguments."
    url: "N/A"
  - name: "Behavioral: fileproviderctl materialize invocations followed by reads of the newly materialized files by a non-sync-client process, indicating cloud-only data being pulled to disk for staging."
    url: "N/A"
