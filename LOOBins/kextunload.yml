    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/macos/defense_evasion_unload_endpointsecurity_kext
  - name: "Command-line monitoring: kextunload (or 'kmutil unload') invoked with -b or -c against a security vendor's CFBundleIdentifier or IOService class"
    url: N/A
