name: mkpassdb
author: Hare Sudhan (@cyb3rbuff)
short_description: Create, read, and modify the macOS Open Directory Password Server database directly.
full_description: >-
  mkpassdb is the low-level administration tool for the Open Directory Password Server database. It performs
  operations the Password Server protocol refuses to expose: creating and destroying the database, generating
  the RSA keys that establish the server's identity, managing the trusted SASL mechanism list, and creating
  administrator accounts. It reads and writes the on-disk database at /var/db/authserver/authservermain
  directly, bypassing the running PasswordService daemon, and every command except -list must run as root. An
  attacker who already has root on an Open Directory master or replica can read every account slot, promote a
  slot to administrator, or relax the global policy for every account, all through a signed Apple binary that
  adds no new file to the host. The /var/db/authserver database exists only on a machine that ran, or was bound
  as a replica of, an Open Directory Password Server; on a plain client Mac these files are absent and the read
  commands return nothing.
created: 2026-09-20
example_use_cases:
  - name: Dump account slots from the Password Server database
    description: >-
      The -dump command outputs all user IDs and corresponding user names held in the Open Directory Password
      Server database. Passing a slot ID limits output to that one account rather than the full roster.
      Adding -v expands the columns to include per-account detail beyond the defaults. Run as root against
      /var/db/authserver/authservermain, it reads the account store directly rather than through the
      PasswordService daemon, giving an attacker a complete inventory of every authenticating principal on the
      server. Returns data only on a host that runs an Open Directory Password Server; on a standalone client
      the database does not exist.
    code: mkpassdb -dump
    tactics:
      - Credential Access
      - Discovery
    tags: []
  - name: Promote an account slot to Password Server administrator
    description: >-
      The -setadmin command promotes a slot ID to administrator privileges for the password server, assigning
      the most privileged rank (0) by default. An attacker with root uses this to grant an account they control
      full administrative authority over the Password Server database, a durable foothold that survives the
      current session. Requires root and an existing Password Server database.
    code: mkpassdb -setadmin <SLOT_ID> 0
    tactics:
      - Privilege Escalation
      - Persistence
    tags: []
  - name: Weaken the global account policy for every user
    description: >-
      The -setglobalpolicy command sets the default policies applied to all users in the Password Server
      database. An attacker with root uses this to relax password expiry, lockout, or complexity controls across
      every account at once, removing constraints that would otherwise age out or trip up planted credentials.
      The man page documents the quoted "policy=value" argument format but does not enumerate the policy keys,
      so confirm them against the target first. Requires root and an existing Password Server database.
    code: mkpassdb -setglobalpolicy "<POLICY>=<VALUE>"
    tactics:
      - Defense Evasion
      - Persistence
    tags:
      - policy
  - name: Enumerate available SASL authentication mechanisms
    description: >-
      The -list command outputs the SASL mechanisms available to the password server and is the only mkpassdb
      command that does not require root. The output reveals which authentication mechanisms are offered,
      including legacy ones the man page marks as always weak (SMB-NT, SMB-LAN-MANAGER, CRYPT, APOP). An attacker
      uses this to find weak mechanisms for a downgrade or offline-cracking attempt against the server.
    code: mkpassdb -list
    tactics:
      - Discovery
    tags: []
paths:
  - /usr/sbin/mkpassdb
detections:
  - name: "Elastic: Dumping Account Hashes via Built-In Commands (process.name == mkpassdb and process.args == -dump)"
    url: https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_dumping_hashes_bi_cmds.toml
resources:
  - name: "Elastic prebuilt rule: Dumping Account Hashes via Built-In Commands"
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/macos/credential_access_dumping_hashes_bi_cmds
  - name: "mkpassdb(8) manual page"
    url: https://www.unix.com/man-page/osx/8/mkpassdb/
