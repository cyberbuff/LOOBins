name: kextload
author: Hare Sudhan (@cyb3rbuff)
short_description: Load kernel extensions (kexts) into the running macOS kernel.
full_description: The kextload binary is the formal command-line interface macOS installers use to load a kernel extension (kext) into the running kernel. Code that runs inside a kext executes at the highest operating system privilege (Ring 0), which lets a kernel-mode rootkit hide its own files, processes and network activity from userland security tooling, tamper with logs and grant backdoor access. This is what makes kextload attractive to an attacker. kextload messages kextd/kernelmanagerd to do the actual load, so the kext must first pass Apple's kext authentication - it has to be signed with a Developer ID granted kext-signing privileges and be owned root:wheel with permissions non-writable by group and other, and loading generally requires root. On Apple Silicon and with SIP enabled, an unsigned or untrusted kext will not load unless the operator has reduced security from recoveryOS (or disabled SIP) and rebooted. The realistic attacker path is therefore an abused or stolen kext-signing identity, or a target already configured with reduced security. kextload is deprecated in favor of "kmutil load", but it remains present on current macOS and is the classic macOS rootkit-installation primitive.
created: 2026-09-20
example_use_cases:
  - name: Install a kernel-mode rootkit by loading a malicious kext
    description: kextload loads a kext bundle into the running kernel, where its code executes at Ring 0 and is not governed by userland security policy. An attacker who has staged a kext under a standard extensions directory can load it to gain kernel-level persistence and stealth. This requires root, and on current macOS the kext must be signed with a Developer-ID kext-signing identity and owned root:wheel with permissions non-writable by group and other (or SIP/security reduced from recoveryOS for an untrusted kext). The OSX/Ventir trojan used this exact primitive, loading an open-source keylogger kext with "kextload /System/Library/Extensions/updated.kext" once it had root.
    code: sudo kextload /Library/Extensions/Rootkit.kext
    tactics:
      - Persistence
      - Privilege Escalation
    tags: []
  - name: Load a kext by bundle identifier from a non-standard repository
    description: The --repository (-r) option adds an arbitrary directory to the set of kexts kextload scans, and --bundle-id (-b) then loads a kext looked up by its CFBundleIdentifier rather than by a path on the command line. Loading from a staging directory outside /System/Library/Extensions and /Library/Extensions, and referencing the kext by identifier, keeps the implant's on-disk location out of the process arguments and away from monitoring focused on the standard extension paths. Requires root and a loadable (authenticated) kext.
    code: sudo kextload -r /private/tmp/.stage -b com.vendor.driver
    tactics:
      - Defense Evasion
    tags: []
  - name: Suppress load output with quiet mode
    description: The --quiet (-q) option makes kextload print no informational or error messages during the load. An attacker loading an implant kext can use it to suppress the output the command itself would otherwise write to the console. It does not silence the kext-load telemetry that kextd/kernelmanagerd and Endpoint Security still emit. Requires root and a loadable kext.
    code: sudo kextload -q /Library/Extensions/Implant.kext
    tactics:
      - Defense Evasion
    tags: []
paths:
  - /sbin/kextload
detections:
  - name: "Splunk: MacOS Kextload Usage - process execution where process_name is kextload, excluding help invocations"
    url: https://research.splunk.com/endpoint/9d680775-84a6-4625-a8ea-8182b9427ce4/
  - name: "Command-line detection: execution of /sbin/kextload with a kext path or -b/--bundle-id argument that does not originate from a known software installer"
    url: N/A
  - name: "Endpoint Security: monitor kext-load events (ES_EVENT_TYPE_NOTIFY_KEXTLOAD) and correlate with kextd/kernelmanagerd activity"
    url: N/A
  - name: "Baseline drift: alert on newly loaded kexts with a non-Apple CFBundleIdentifier or a kext loaded from outside the standard extensions directories (compare kextstat output against a known-good baseline)"
    url: N/A
