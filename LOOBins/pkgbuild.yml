name: pkgbuild
author: Hare Sudhan (@cyb3rbuff)
short_description: Build a macOS Installer component package (.pkg) from on-disk files and install scripts.
full_description: The pkgbuild binary builds a flat macOS Installer component package (.pkg) from a directory tree, one or more bundles, or a scripts folder. It ships at /usr/bin/pkgbuild on stock macOS, so building a package needs no Xcode. On a build machine an attacker uses it to turn a shell script into an installer whose preinstall and postinstall scripts run as root when a victim installs the package, and to sign that package so it presents as legitimate software. Because these scripts execute through the macOS Installer rather than a shell the user launched, packaged installers are a recurring delivery and privilege-escalation route in macOS malware.
created: 2026-09-20
example_use_cases:
  - name: Weaponize a shell script as a root-executing installer package
    description: An executable preinstall or postinstall script in the --scripts directory becomes the package's top-level script; --nopayload makes the package carry only that script and no files. The Installer runs it as root via its package_script_service helper once the victim authorizes the install. A quarantined package that is neither signed nor notarized is blocked by Gatekeeper on a default system.
    code: pkgbuild --nopayload --scripts scripts --identifier com.apple.update --version 1.0 Update.pkg
    tactics:
      - Execution
      - Privilege Escalation
      - Resource Development
    tags: []
  - name: Drop a payload with the package and launch or persist it from postinstall
    description: --root archives a staged tree as the payload, --install-location sets where it is written, and --scripts supplies postinstall. Staging a LaunchDaemon plist and its executable in the root tree, then loading the job from postinstall, drops the payload and registers persistence in one install. Payload files default to root:wheel (the ownership launchd requires of a system LaunchDaemon); --ownership preserve keeps their staged UID and GID instead. FlexibleFerret, part of the DPRK 'Contagious Interview' campaign, shipped as a package whose postinstall ran components under /var/tmp.
    code: pkgbuild --root ./payload_root --install-location /Library --scripts ./scripts --identifier com.vendor.helper --version 1.0 Helper.pkg
    tactics:
      - Persistence
      - Privilege Escalation
      - Execution
    tags: []
  - name: Sign a malicious package to satisfy Gatekeeper
    description: --sign signs the package with an identity in an accessible keychain; --keychain selects which keychain to search. A stolen or abused Developer ID makes the package present as a known developer's software rather than raising the unsigned-package warning. Both Silver Sparrow packages used Apple Developer IDs later revoked. Signing requires holding the identity and does not notarize the package, which current macOS checks before installing a quarantined one.
    code: 'pkgbuild --nopayload --scripts scripts --identifier com.vendor.update --version 1.0 --sign "Developer ID Installer: <IDENTITY_NAME>" --keychain <KEYCHAIN_PATH> Update.pkg'
    tactics:
      - Defense Evasion
      - Resource Development
    tags: []
paths:
  - /usr/bin/pkgbuild
