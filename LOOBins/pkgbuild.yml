name: pkgbuild
author: Hare Sudhan (@cyb3rbuff)
short_description: Build a macOS Installer component package (.pkg) from on-disk files and install scripts.
full_description: The pkgbuild binary is a command-line utility that builds a flat macOS Installer component package (.pkg) from a directory tree, one or more bundles, or a scripts folder. It ships at /usr/bin/pkgbuild on stock macOS, so no Xcode installation is needed to build a package. Attackers use it on a build machine to turn a shell script into an installer whose preinstall and postinstall scripts run with root privileges when a victim installs the package, and to sign that package so it presents as legitimate software. Because the scripts execute through the macOS Installer rather than a shell the user launched, packaged installers are a recurring delivery and privilege-escalation route in macOS malware.
created: 2026-09-20
example_use_cases:
  - name: Weaponize a shell script as a root-executing installer package
    description: A script named preinstall or postinstall in the directory passed to --scripts runs as the top-level script of the package pkgbuild produces; the attacker stages that script and marks it executable before packaging. pkgbuild --nopayload --scripts then builds a package that contains no files, only the postinstall script. The Installer executes that script as root through its package_script_service helper once the victim authorizes the install, so the shell command placed in postinstall runs with elevated privileges. The package still has to be delivered to and opened by the victim, and a quarantined package that is neither signed nor notarized is blocked by Gatekeeper on a default system.
    code: pkgbuild --nopayload --scripts scripts --identifier com.apple.update --version 1.0 Update.pkg
    tactics:
      - Execution
      - Privilege Escalation
      - Resource Development
    tags: []
  - name: Drop a payload with the package and launch or persist it from postinstall
    description: pkgbuild --root archives a staged directory tree as the payload, --install-location sets where its contents are written on the target, and --scripts supplies the postinstall script that runs once the files have landed. An attacker stages a LaunchDaemon property list and its executable in the root tree and has postinstall load the job, so the payload is written to disk and registered for persistence during a single install. Payload files are archived as root:wheel by default, which is the ownership launchd requires of a system LaunchDaemon; --ownership preserve instead archives the UID and GID of the staged files. FlexibleFerret, part of the DPRK 'Contagious Interview' campaign, was delivered as an installer package whose postinstall script executed components dropped under /var/tmp.
    code: pkgbuild --root ./payload_root --install-location /Library --scripts ./scripts --identifier com.vendor.helper --version 1.0 Helper.pkg
    tactics:
      - Persistence
      - Privilege Escalation
      - Execution
    tags: []
  - name: Sign a malicious package to satisfy Gatekeeper
    description: pkgbuild --sign adds a digital signature from an identity in an accessible keychain, and --keychain points at a specific keychain to search. A package signed with a stolen or abused Developer ID presents as software from a known developer instead of triggering the warning an unsigned package produces. Both Silver Sparrow installer packages were signed with Apple Developer IDs that were later revoked. Signing requires the attacker to hold the signing identity, and it does not notarize the package, which current macOS also checks before allowing a quarantined package to install.
    code: 'pkgbuild --nopayload --scripts scripts --identifier com.vendor.update --version 1.0 --sign "Developer ID Installer: <IDENTITY_NAME>" --keychain <KEYCHAIN_PATH> Update.pkg'
    tactics:
      - Defense Evasion
      - Resource Development
    tags: []
paths:
  - /usr/bin/pkgbuild
