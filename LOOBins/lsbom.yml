name: lsbom
author: Hare Sudhan (@cyb3rbuff)
short_description: Print the file manifest, permissions and ownership recorded inside a macOS bill-of-materials (bom) file.
full_description: The lsbom binary interprets binary bom(5) files and prints, for every entry, the path, octal mode, UID/GID and (for plain files) size and CRC checksum. It ships at /usr/bin/lsbom on stock macOS, so no Xcode installation is needed. The Installer writes a .bom for every product it installs into /var/db/receipts, and macOS system and security updates leave theirs in /System/Library/Receipts; these receipt files are world-readable by default. Because a receipt bom is an exact inventory of what a package placed on disk - including the permissions the installer set - lsbom lets an attacker enumerate installed security agents, management tooling and third-party software and their on-disk layout without touching a single installed binary, and lets them spot setuid, setgid or world-writable paths worth hijacking for privilege escalation. lsbom also reads the Bom file inside an expanded flat package, revealing exactly what an uninstalled .pkg would drop before it is run. Its companion mkbom builds a bom for packaging.
created: 2026-09-20
example_use_cases:
  - name: Enumerate installed software and its on-disk layout from receipt bom files
    description: Every package installed by the macOS Installer leaves a bom under /var/db/receipts, and these files are world-readable by default, so any user can read them without privileges. Running lsbom against a receipt prints the full path of every file and directory the package installed together with its mode and UID/GID, giving an attacker a precise inventory of a product's footprint without reading or executing any of the installed binaries, which draws no attention from tooling that watches the applications themselves. The -s option limits output to paths for a quick listing.
    code: lsbom -s /var/db/receipts/com.<VENDOR>.<PRODUCT>.bom
    tactics:
      - Discovery
    tags: []
  - name: Locate setuid, setgid and world-writable install paths for privilege escalation
    description: A receipt bom records the exact mode the installer set on every file it placed on disk. lsbom -p Mf prints each entry's symbolic mode (for example -rwsr-xr-x) next to its filename, so an operator can filter the output for setuid/setgid binaries and for world-writable files and directories owned by root. A world-writable directory in the load path of a privileged process, or a setuid root binary, is a candidate for binary or library hijacking. This needs only read access to the world-readable receipt, so it can be done as an unprivileged user before attempting escalation. The example filters for the others-write bit.
    code: lsbom -p Mf /var/db/receipts/com.<VENDOR>.<PRODUCT>.bom | grep -E '^.{8}w'
    tactics:
      - Privilege Escalation
      - Discovery
    tags: []
  - name: Map a specific security product's footprint to neutralize it
    description: An attacker who wants to disable or replace an endpoint security product can read that vendor's receipt bom to enumerate every file, helper and symbolic link the product installed and exactly where each one lives, ensuring a complete take-down or a targeted file replacement rather than a partial one. The -f and -l flags restrict the listing to plain files and symbolic links, filtering out directories and device entries. Reading the receipt requires no privileges; acting on the enumerated paths does.
    code: lsbom -f -l /var/db/receipts/com.<EDR_VENDOR>.<PRODUCT>.bom
    tactics:
      - Defense Evasion
      - Discovery
    tags: []
  - name: Read a package's file manifest without installing it
    description: A macOS flat installer package contains a Bom file describing every path in its payload. After a package is expanded into a directory tree, lsbom against that Bom lists exactly what the package would install and where, along with the modes it would set, letting an operator vet a package pulled from a distribution share, an MDM cache or a download - or decide what to alter before trojanizing it - without ever launching the Installer. This reads the package on disk and changes nothing.
    code: lsbom -p MUGsf /tmp/pkg/<COMPONENT>.pkg/Bom
    tactics:
      - Discovery
      - Resource Development
    tags: []
paths:
  - /usr/bin/lsbom
detections:
  - name: "Process telemetry: lsbom invoked with a path argument under /var/db/receipts or /System/Library/Receipts by a parent other than the Installer stack (installd, package_script_service), for example a shell, Terminal or SSH session"
    url: N/A
  - name: "Process telemetry: lsbom run with the -p flag and its output piped to grep or awk, indicating filtering of permission modes rather than routine listing"
    url: N/A
  - name: "Process lineage: lsbom or mkbom executing outside a package build or installation context (normal callers are installd and packaging tools), especially from a user-writable or temporary directory"
    url: N/A
