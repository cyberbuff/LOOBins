    url: https://specterops.io/blog/2019/11/14/when-kirbi-walks-the-bifrost/
  - name: "Bifrost source repository"
    url: https://github.com/its-a-feature/Bifrost
  - name: "Apple Heimdal kcc-commands definition (authoritative subcommand and flag list)"
    url: https://github.com/apple-oss-distributions/Heimdal/blob/main/kuser/kcc-commands.in
  - name: "kcc man page (Xcode man pages)"
    url: https://keith.github.io/xcode-man-pages/kcc.1.html
  - name: "MITRE ATT&CK T1558.005 Steal or Forge Kerberos Tickets: Ccache Files"
    url: https://attack.mitre.org/techniques/T1558/005/
acknowledgements:
