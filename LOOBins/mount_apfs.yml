    url: https://theevilbit.github.io/posts/cve_2020_9771/
  - name: "Bypassing macOS TCC User Privacy Protections By Accident and Design (SentinelLabs)"
    url: https://www.sentinelone.com/labs/bypassing-macos-tcc-user-privacy-protections-by-accident-and-design/
  - name: "Return of the mac(OS): TCC Database Manipulation (Interpres Security)"
    url: https://web.archive.org/web/20240411112413/https://interpressecurity.com/resources/return-of-the-macos-tcc/
  - name: "MITRE ATT&CK T1006: Direct Volume Access"
    url: https://attack.mitre.org/techniques/T1006/
acknowledgements:
