name: kickstart
author: Hare Sudhan (@cyb3rbuff)
short_description: Activate and configure the built-in Remote Management (Apple Remote Desktop) service from the command line.
full_description: |
  kickstart is a Perl script shipped inside the Apple Remote Desktop agent bundle at
  /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart. It is Apple's supported
  way to install, activate, configure and restart the Remote Management service without a reboot or a trip through
  System Settings, and it is documented in Apple support article 101439. Running as root, it loads the
  com.apple.screensharing LaunchDaemon, writes the string "enabled" to
  "/Library/Application Support/Apple/Remote Desktop/RemoteManagement.launchd", sets the per-user ARD privilege
  bitmask ("naprivs") on local user records through dscl, and writes the client settings to
  /Library/Preferences/com.apple.RemoteManagement.plist and /Library/Preferences/com.apple.RemoteDesktop.plist.
  For an attacker who already has root - typically over SSH - that single Apple-signed script turns a host into a
  fully controllable screen-sharing and remote-command endpoint (TCP 5900 and 3283) with no tooling dropped on disk,
  and the same script can grant access to a chosen account, set a legacy VNC password, hide the Remote Management
  menu bar indicator and later strip every trace of the configuration. Mandiant observed exactly this in macOS
  intrusions: attackers connected over SSH and ran kickstart to enable Remote Desktop, then moved laterally over the
  screen-sharing channel. The script requires root and refuses to run otherwise. On macOS 10.14 and later it also
  checks TCC state and warns that screen recording or screen control may still be blocked, so activation alone does
  not guarantee a usable screen unless the ARDAgent already holds the relevant TCC grants (for example via an MDM
  PPPC payload or a prior enablement in System Settings).
created: 2026-09-20
example_use_cases:
  - name: Activate Remote Management and grant every local user full control
    description: |
      The -activate parent option loads the com.apple.screensharing LaunchDaemon and writes "enabled" to the
      RemoteManagement.launchd marker file, and -configure -allowAccessFor -allUsers -privs -all sets
      ARD_AllLocalUsers and the all-user privilege mask in /Library/Preferences/com.apple.RemoteManagement.plist so
      that any local account can log in with full control. This is the exact shape of the command Mandiant observed
      attackers run after connecting over SSH, and it maps to MITRE ATT&CK T1021.005 (Remote Services: VNC).
      Requires root. On macOS 10.14 and later the ARDAgent additionally needs Screen Recording and Accessibility TCC
      grants for screen control to work; kickstart itself prints a warning when those are missing.
    code: |
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all -quiet
    tactics:
      - Lateral Movement
      - Persistence
      - Command and Control
    tags: []
  - name: Grant ARD access to a single attacker-controlled account
    description: |
      Instead of flipping the all-users switch, -configure -access -on -privs -all -users <USERNAME> sets the
      "naprivs" bitmask on just the named local user record in the DSLocal database via dscl. The Remote Management
      pane in System Settings then shows access limited to specified users, which looks closer to a normal
      administrative configuration than "all users, all privileges" and leaves fewer accounts changed. Requires root
      and an existing local account with a UID above 500.
    code: |
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -access -on -privs -all -users <USERNAME>
    tactics:
      - Persistence
      - Lateral Movement
    tags: []
  - name: Enable legacy VNC authentication with an attacker-chosen password
    description: |
      -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw <PASSWORD> turns on the legacy VNC
      password mode and stores the password in /Library/Preferences/com.apple.VNCSettings.txt. This creates an
      authentication path into the host that does not depend on any macOS account password, so it survives a password
      reset of the compromised user and is reachable from any standard VNC client rather than only from the paid
      Apple Remote Desktop admin console. Two weaknesses make it worse for the defender: kickstart obfuscates the
      stored password with a fixed XOR key rather than a real cipher, so the file is trivially reversible by anyone
      who can read it, and the legacy VNC service truncates the password to an 8 character authentication buffer with
      no rate limiting, making it practical to brute force. Requires root.
    code: |
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw <PASSWORD>
    tactics:
      - Persistence
      - Defense Evasion
    tags: []
  - name: Hide the Remote Management menu bar indicator
    description: |
      -configure -clientopts -setmenuextra -menuextra no sets LoadRemoteManagementMenuExtra to false in
      /Library/Preferences/com.apple.RemoteManagement.plist, which stops the Remote Management menu extra from
      loading in the menu bar. Paired with -restart -menu to reload the SystemUIServer-hosted item, this removes the
      most visible on-screen cue that the service has been turned on, so a user working at the console sees no
      indicator for the newly enabled remote access. Requires root.
    code: |
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setmenuextra -menuextra no -restart -menu
    tactics:
      - Defense Evasion
    tags: []
  - name: Escalate a headless SSH foothold to an interactive desktop session
    description: |
      A shell obtained over SSH cannot answer GUI-only prompts such as TCC consent dialogs, keychain unlock requests
      or authorization sheets. Activating Remote Management over that SSH session and restarting the agent gives the
      attacker a screen-sharing channel into the console user's live session, where those dialogs can be clicked
      through as the logged-in user, and where the desktop, open documents and typed content can be observed
      directly. Requires root over SSH, an interactive console session on the target, and - on macOS 10.14 and later
      - the Screen Recording and Accessibility TCC grants for the ARDAgent, without which the screen stays blank or
      input is refused.
    code: |
      ssh <USER>@<TARGET_IP> "sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -privs -all -users <USERNAME> -restart -agent -console"
    tactics:
      - Collection
      - Defense Evasion
      - Lateral Movement
    tags:
      - ssh
  - name: Deactivate the service and strip the access privileges after use
    description: |
      -deactivate unloads the com.apple.screensharing LaunchDaemon, kills the screen sharing daemon and agent, and
      deletes the RemoteManagement.launchd marker file that Mandiant recommends monitoring. -uninstall -settings
      additionally deletes /Library/Preferences/com.apple.RemoteDesktop.plist,
      /Library/Preferences/com.apple.ARDAgent.plist and /Library/Preferences/com.apple.RemoteManagement.plist, and
      destroys the "naprivs" attribute on every local user record. An attacker can use this to remove the
      configuration evidence of the access once the objective is met, leaving the unified log as the main remaining
      record of the activity. Requires root.
    code: |
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -uninstall -settings -deactivate -stop -quiet
    tactics:
      - Defense Evasion
    tags: []
paths:
  - /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
detections:
  - name: "File modification monitoring: creation of or writes to '/Library/Application Support/Apple/Remote Desktop/RemoteManagement.launchd' (contains the string 'enabled' after activation) on hosts where Apple Remote Desktop is not in use"
    url: https://cloud.google.com/blog/topics/threat-intelligence/leveraging-apple-remote-desktop-for-good-and-evil
  - name: "Unified log review: unexpected kickstart executions, hunted for in the macOS unified logs"
    url: https://cloud.google.com/blog/topics/threat-intelligence/leveraging-apple-remote-desktop-for-good-and-evil
  - name: "Unified log query for screen sharing authentication events: log show --predicate 'processImagePath CONTAINS \"screensharingd\" AND eventMessage CONTAINS \"Authentication\"'"
    url: https://blog.lockboxx.org/2019/07/macos-red-teaming-206-ard-apple-remote.html
  - name: "Command line argument detection (process name is kickstart AND args contain -activate OR -allowAccessFor OR -setvncpw OR -setvnclegacy)"
    url: N/A
  - name: "File monitoring: creation or modification of /Library/Preferences/com.apple.VNCSettings.txt, which is only written when a legacy VNC password is set"
    url: N/A
  - name: "Directory Services monitoring: addition of the 'naprivs' attribute to local user records, or writes to ARD_AllLocalUsers / ARD_AllLocalUsersPrivs in /Library/Preferences/com.apple.RemoteManagement.plist"
    url: N/A
  - name: "Process lineage detection: kickstart spawned from a non-interactive parent such as sshd, or from a scripting host rather than an administrator's Terminal session"
    url: N/A
