name: sandbox-exec
author: Hare Sudhan (@cyb3rbuff)
short_description: Launch an arbitrary command inside a Seatbelt sandbox described by a profile.
full_description: |
  sandbox-exec is a macOS command-line utility that places a process into a Seatbelt (App Sandbox) container described by an
  SBPL (Sandbox Profile Language) profile, supplied inline with -p, from a file with -f, or by name with -n. Apple marks it
  DEPRECATED and steers developers toward the entitlement-based App Sandbox, but the binary still ships on every macOS install
  and continues to execute profiles. Its offensive value is not the sandboxing itself but the launcher: the command it runs
  becomes a child of /usr/bin/sandbox-exec, an Apple-signed system binary, so any detection logic keyed on the original
  parent-child lineage (for example "a document app spawned a shell") sees sandbox-exec in the middle instead. A permissive
  profile such as (version 1)(allow default) imposes no meaningful restriction, turning the tool into a plain proxy launcher,
  while a hand-written restrictive profile lets an operator confine a dropped second-stage to only the paths and services it
  needs. The Endpoint Security framework observes process and file events at the kernel regardless of
  the Seatbelt profile, so this does not blind a modern EDR to the exec itself; the evasion is against lineage- and
  path-based heuristics, not against kernel telemetry. Public reporting documents sandbox-exec mostly in defensive and
  research contexts (malware containment, build sandboxing); no threat-intelligence report reviewed here names it in an
  in-the-wild attack chain.
created: 2026-09-20
example_use_cases:
  - name: Proxy execution under an Apple-signed parent with a permissive profile
    description: A permissive inline profile applies no real restriction, so sandbox-exec runs the target command essentially unmodified while inserting itself as the parent process. The payload's immediate parent becomes /usr/bin/sandbox-exec (Apple-signed) rather than the delivery process, breaking parent-child lineage heuristics. The -p flag supplies the profile string on the command line.
    code: sandbox-exec -p '(version 1)(allow default)' /path/to/payload
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Execute from an attacker-supplied profile file
    description: The -f flag reads the profile from a file on disk instead of the command line, keeping process arguments short and moving the profile into a dropped .sb artifact. Combined with a permissive profile this preserves the lineage-laundering effect while the profile file can be staged in a temporary or hidden location alongside the payload.
    code: sandbox-exec -f /private/tmp/.profile.sb /path/to/payload
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Confine a dropped second-stage to attacker-chosen paths
    description: A deny-by-default profile with selective allow rules restricts what the launched process can read, write, and reach, letting an operator scope a second-stage so it touches only intended locations (for example writing solely under /private/tmp). This shapes the payload's own resource access and file-path footprint; it does not hide the exec from the Endpoint Security framework, which observes it at the kernel regardless of the Seatbelt profile.
    code: sandbox-exec -p '(version 1)(deny default)(allow process*)(allow file-read*)(allow file-write* (subpath "/private/tmp"))(allow network*)' /path/to/payload
    tactics:
      - Defense Evasion
    tags: []
paths:
  - /usr/bin/sandbox-exec
detections:
  - name: "Command-line detection: process exec of /usr/bin/sandbox-exec with -p, -f, or -n outside of known developer tooling (e.g. Bazel build sandboxing)"
    url: N/A
  - name: "Process lineage detection: /usr/bin/sandbox-exec as the parent of a shell, scripting interpreter, or other unexpected child process"
    url: N/A
  - name: "Endpoint Security exec monitoring: ES_EVENT_TYPE_NOTIFY_EXEC events for /usr/bin/sandbox-exec, notable because the binary is deprecated and rarely launched interactively"
    url: N/A
