    url: https://keith.github.io/xcode-man-pages/SafeEjectGPU.8.html
  - name: "MITRE ATT&CK T1218: System Binary Proxy Execution"
    url: https://attack.mitre.org/techniques/T1218/
  - name: "MacHack: Hidden Tools in macOS"
    url: https://github.com/azenla/MacHack
