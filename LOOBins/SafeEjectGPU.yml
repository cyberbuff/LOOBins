name: SafeEjectGPU
author: Hare Sudhan (@cyb3rbuff)
short_description: Launch application bundles and send relaunch stimulus to processes via an Apple-signed eGPU management utility.
full_description: SafeEjectGPU is a command-line utility introduced in macOS 10.13.4 that prepares external GPUs (eGPUs) for safe disconnection. It lists attached GPUs and the apps referencing them, and relaunches or terminates those apps. Two subcommands matter to an attacker who already has code execution. LaunchOnGPU launches an arbitrary application bundle, and RelaunchPID / RelaunchPIDOnGPU send a relaunch stimulus to a specific process. The utility is Apple-signed, present on every install, and at a fixed path, so a bundle it launches is parented to SafeEjectGPU rather than a shell, Terminal, or scripting host. It has no public report of abuse in the wild; its value is as a signed proxy-execution primitive.
created: 2026-09-20
example_use_cases:
  - name: Proxy execution of an application bundle via LaunchOnGPU
    description: LaunchOnGPU launches an application from a given bundle path, parenting the process to the Apple-signed /usr/bin/SafeEjectGPU rather than the shell or scripting host. The target must be a valid .app bundle, and per the man page the command has no effect if an instance is already running. An optional gpuids prefix limits which GPUs the app can select from but is not required.
    code: SafeEjectGPU LaunchOnGPU /path/to/Payload.app
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Enumerate GPUs and the processes holding references to them
    description: The gpus, apps, and status subcommands report attached GPUs (gpuid, vendor/model, flags), the apps referencing each GPU (PID, RPID, USER, PROCESS, APIS, BUNDLE_IDENTIFIER, PATH, and eject/selection policies), and per-GPU eject state. This yields host, user, and running-process reconnaissance from a GPU utility rather than ps or system_profiler.
    code: SafeEjectGPU gpus apps status
    tactics:
      - Discovery
    tags:
      - enumeration
  - name: Force a target process to relaunch or terminate via RelaunchPID
    description: RelaunchPID applies a relaunch stimulus to a single PID, and can be paired with Initiate and Cancel to send it without a full eject. The stimulus follows the target's GPUEjectPolicy, read from its Info.plist rather than chosen by the caller, so the outcome depends on the target. A relaunch policy sends an AppKit quit-with-save event then open-with-restore, while a kill policy uses SIGKILL and relies on launchd to restart the app. RelaunchPIDOnGPU adds a gpuids list to constrain the GPUs the relaunched process sees.
    code: SafeEjectGPU Initiate RelaunchPID <PID> Cancel
    tactics:
      - Defense Evasion
      - Impact
    tags:
      - processes
paths:
  - /usr/bin/SafeEjectGPU
detections: []
resources:
