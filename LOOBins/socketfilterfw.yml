name: socketfilterfw
author: Hare Sudhan (@cyb3rbuff)
short_description: Query and modify the macOS Application Firewall from the command line.
full_description: |
  socketfilterfw is the command-line control for the macOS Application Layer Firewall (ALF),
  the built-in firewall that filters inbound network connections on a per-application basis.
  It lives in its own libexec subdirectory rather than a standard bin path and is normally
  used by administrators and MDM tooling to turn the firewall on or off, toggle stealth and
  block-all modes, and allow or block individual applications. Because every one of these
  operations is a single root command with no GUI interaction, an attacker who has already
  gained root can use it to weaken the host's inbound network defenses: disabling the firewall
  outright, or pre-authorizing a planted listener so an inbound bind shell or command-and-control
  implant accepts connections without ever raising the "allow incoming connections?" prompt.
  The ALF only governs inbound traffic, so socketfilterfw does not help hide outbound beacons,
  but it is the native tool for the macOS instance of MITRE ATT&CK T1562.004 (Impair Defenses:
  Disable or Modify System Firewall).
created: 2026-09-20
example_use_cases:
  - name: Disable the Application Firewall entirely
    description: |
      Turning the firewall off with --setglobalstate off removes all per-application inbound
      filtering and the associated "allow incoming connections?" prompts, so any listening
      service an attacker plants on the host becomes reachable from the network. Requires root.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
    tactics:
      - Defense Evasion
    tags:
      - firewall
  - name: Register a planted listener with the Application Firewall
    description: |
      --add registers an application with the firewall. Applied to an attacker's bind shell or C2 implant,
      this creates a persistent firewall record for the binary. Requires root, and the implant binary must
      exist at the referenced path.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --add <IMPLANT_PATH>
    tactics:
      - Defense Evasion
      - Persistence
      - Command and Control
    tags:
      - firewall
  - name: Allow a registered listener to receive inbound connections
    description: --unblockapp marks a registered application as allowed to receive inbound connections. This lets a planted listener accept connections while the firewall remains enabled. Requires root and an application already registered with --add.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp <IMPLANT_PATH>
    tactics:
      - Defense Evasion
      - Persistence
      - Command and Control
    tags:
      - firewall
  - name: Disable block-all mode to re-open inbound access
    description: |
      Block-all mode blocks incoming connections to all non-essential applications, including
      signed ones, and is sometimes enabled as a hardening measure. Turning it off with
      --setblockall off reverses that hardening so a listening implant is once again reachable
      while the firewall itself remains on. Requires root.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --setblockall off
    tactics:
      - Defense Evasion
    tags:
      - firewall
  - name: Check whether the Application Firewall is enabled
    description: |
      --getglobalstate reports whether the Application Firewall is enabled. An attacker uses it to decide
      whether an inbound listener needs the firewall weakened first. Requires root.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
    tactics:
      - Discovery
    tags:
      - firewall
      - enumeration
  - name: Check whether Application Firewall stealth mode is enabled
    description: --getstealthmode reports whether stealth mode is active. This tells an attacker whether the host ignores unsolicited network probes while evaluating listener deployment. Requires root.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode
    tactics:
      - Discovery
    tags:
      - firewall
      - enumeration
  - name: List applications allowed by the Application Firewall
    description: --listapps lists the firewall's registered applications and their allowance state. An attacker can identify existing allow-list entries worth impersonating. Requires root.
    code: /usr/libexec/ApplicationFirewall/socketfilterfw --listapps
    tactics:
      - Discovery
    tags:
      - firewall
      - enumeration
paths:
  - /usr/libexec/ApplicationFirewall/socketfilterfw
detections:
