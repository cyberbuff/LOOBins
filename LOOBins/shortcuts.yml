name: shortcuts
author: Hare Sudhan (@cyb3rbuff)
short_description: Run, list, view, and sign macOS Shortcuts from the command line.
full_description: |-
  shortcuts is the command-line front end for the Shortcuts app, introduced in macOS Monterey. It runs,
  lists, views, and signs shortcuts in the current user's library. A shortcut can contain Run Shell Script
  and Run AppleScript actions, and "shortcuts run" does not execute those actions as a child of the calling
  shell: the work is dispatched through the WorkflowKit XPC services (BackgroundShortcutRunner.xpc, which
  drives the Full-Disk-Access-entitled ShortcutsMacHelper.xpc), so the resulting shell is parented to those
  helpers rather than to the terminal, and a planted shortcut acts inside the Shortcuts app's TCC grants.
  Shortcut definitions live in ~/Library/Shortcuts/Shortcuts.sqlite; the binary cannot create or edit a
  shortcut, which is done in the Shortcuts app or by importing a crafted .shortcut file.
created: 2026-09-20
example_use_cases:
- name: Execute a shell payload through the Shortcuts XPC helpers
  description: |-
    "shortcuts run" launches a shortcut containing a Run Shell Script action. The command is not run as a
    child of the invoking shell; the request is handed to BackgroundShortcutRunner.xpc, which drives
    ShortcutsMacHelper.xpc, so the shell process is parented to those WorkflowKit helpers. Prerequisite: a
    shortcut named <SHORTCUT> with a Run Shell Script (or Run AppleScript) action must already exist in the
    user's library, built in the Shortcuts app or imported as a signed .shortcut file, with scripting
    actions enabled.
  code: shortcuts run "<SHORTCUT>"
  tactics:
  - Execution
  - Defense Evasion
  tags: []
- name: Enumerate a user's shortcuts with their identifiers
  description: |-
    "shortcuts list --show-identifiers" prints every shortcut in the current user's library with each item's
    UUID. This identifies automations with shell, AppleScript, or file-access actions worth reusing and
    supplies the identifiers needed to target a specific shortcut with "run". It requires user-level access,
    no root and no TCC grant.
  code: shortcuts list --show-identifiers
  tactics:
  - Discovery
  tags: []
- name: Enumerate a user's shortcut folders
  description: |-
    "shortcuts list --folders" lists the folders that organize the current user's shortcuts, revealing
    categories of automation worth investigating. It needs no root access or TCC grant.
  code: shortcuts list --folders
  tactics:
  - Discovery
  tags: []
- name: Collect sensitive data through a shortcut running in the Shortcuts TCC context
  description: |-
    A shortcut whose actions read Photos, Contacts, files, or the clipboard runs inside the Shortcuts app's
    privacy context rather than the terminal's. "shortcuts run" drives such a shortcut and captures its
    output, using --output-path - to write results to stdout (or a file) and --input-path to feed it a
    target path. If the user has granted the Shortcuts app the relevant TCC access (for example Full Disk
    Access or Contacts), the shortcut inherits it without prompting. Prerequisite: the data-reading shortcut
    must already exist in the library, and the Shortcuts app must hold the corresponding TCC grant.
  code: shortcuts run "<COLLECTOR_SHORTCUT>" --input-path <TARGET_PATH> --output-path -
  tactics:
  - Collection
  tags: []
- name: Sign a malicious shortcut for distribution
  description: |-
    "shortcuts sign" produces a signed .shortcut file from an input shortcut. With --mode anyone the file is
    notarized via iCloud so any recipient can import it; --mode people-who-know-me signs it locally for
    contacts only. An attacker can package a shortcut carrying a shell or data-exfiltration action, sign it
    so it imports without the unsigned-shortcut warning, and deliver it for the victim to add to their
    library, where it can then be triggered with "shortcuts run".
  code: shortcuts sign --mode anyone --input <PAYLOAD>.shortcut --output <SIGNED>.shortcut
  tactics:
  - Resource Development
  - Defense Evasion
  tags: []
paths:
- /usr/bin/shortcuts
detections: []
