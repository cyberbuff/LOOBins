    url: https://keith.github.io/xcode-man-pages/brctl.1.html
  - name: "Diagnosing iCloud problems using brctl, sync budgets and throttles (The Eclectic Light Company)"
    url: https://eclecticlight.co/2018/04/12/diagnosing-icloud-problems-using-brctl-sync-budgets-and-throttles/
  - name: "icloud-tools: notes on brctl download/evict removal in macOS Sonoma 14+"
    url: https://github.com/icanhasjonas/icloud-tools
