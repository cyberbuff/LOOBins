name: brctl
author: Hare Sudhan (@cyb3rbuff)
short_description: Manage the CloudDocs daemon that syncs iCloud Drive.
full_description: >-
  brctl is the command-line control utility for the CloudDocs daemon (bird), the per-user process
  that syncs iCloud Drive. It runs in the context of the calling user and talks to that user's
  iCloud session, needing no root or TCC grant. Its subcommands dump the CloudDocs database,
  monitor container activity in real time, list non-local document versions, and collect the user's
  mobile documents into an archive. For an attacker with code execution as a user signed into iCloud
  Drive, brctl is a native way to inventory and stage cloud-stored data from a shell, including
  items not materialized on local disk.
created: 2026-09-20
example_use_cases:
  - name: Inventory iCloud Drive by dumping the CloudDocs database
    description: >-
      The dump subcommand writes out the CloudDocs database, the daemon's record of every item in
      the user's iCloud Drive containers, including items stored only in iCloud. -o redirects the
      output to a file.
    code: brctl dump -o /tmp/clouddocs.txt
    tactics:
      - Collection
      - Discovery
    tags: []
  - name: Collect the user's iCloud Drive documents into a diagnosis archive
    description: >-
      The diagnose subcommand with --collect-mobile-documents bundles the user's mobile documents
      (iCloud Drive containers under ~/Library/Mobile Documents) together with CloudDocs logs and
      sync state into an archive at the chosen output path. Runs as the logged-in user with no
      elevation needed.
    code: brctl diagnose --collect-mobile-documents <OUTPUT_PATH>
    tactics:
      - Collection
    tags: []
  - name: Monitor iCloud Drive activity in real time
    description: >-
      The monitor subcommand uses NSMetadataQuery to watch a CloudDocs container and stream changes
      as they happen. --scope narrows the query to document metadata (DOCS), file data (DATA),
      or both.
    code: brctl monitor --scope DOCS com~apple~CloudDocs
    tactics:
      - Collection
      - Discovery
    tags:
      - monitoring
  - name: Enumerate non-local versions of a sensitive document
    description: >-
      The versions subcommand lists the non-local versions of a document held in iCloud, and with
      --all it also includes versions already cached locally. This exposes prior revisions retained
      in iCloud but not present on disk.
    code: brctl versions --all "<PATH>"
    tactics:
      - Discovery
      - Collection
    tags: []
  - name: Stream CloudDocs daemon logs to observe sync activity
    description: >-
      The log subcommand reads the CloudDocs daemon logs, and with --wait it follows them
      continuously. The stream surfaces document paths, container names, and sync events.
    code: brctl log --wait
    tactics:
      - Discovery
      - Collection
    tags:
      - logging
paths:
  - /usr/bin/brctl
detections: []
resources:
  - name: "Elastic macOS unified logs integration (can ingest brctl process execution telemetry)"
    url: https://www.elastic.co/docs/reference/integrations/unifiedlogs
  - name: "brctl(1) manual page (Apple xcode-man-pages mirror)"
    url: https://keith.github.io/xcode-man-pages/brctl.1.html
  - name: "Diagnosing iCloud problems using brctl, sync budgets and throttles (The Eclectic Light Company)"
    url: https://eclecticlight.co/2018/04/12/diagnosing-icloud-problems-using-brctl-sync-budgets-and-throttles/
  - name: "icloud-tools: notes on brctl download/evict removal in macOS Sonoma 14+"
    url: https://github.com/icanhasjonas/icloud-tools
