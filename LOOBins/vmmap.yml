name: vmmap
author: Hare Sudhan (@cyb3rbuff)
short_description: Map another process's virtual memory regions to locate secret-bearing heap allocations.
full_description: |
  The Apple-signed vmmap binary displays a process's virtual memory regions, labelling each by purpose
  (MALLOC_TINY, MALLOC_SMALL, stack, __TEXT, __DATA), address range, protection bits and sharing mode.
  It targets a pid, a full or partial executable name, or a ".memgraph" file from leaks or the Xcode
  Memory Graph Debugger. An attacker uses it to name the exact heap ranges holding passwords, tokens,
  keys and decrypted data before scraping them. Reading a process requires its task port: a same-user
  debuggable target (no hardened runtime, or get-task-allow) needs no root, most others require root,
  and SIP-protected platform binaries cannot be read even as root. A ".memgraph" file is analysed
  offline with no privileges.
created: 2026-09-20
example_use_cases:
  - name: Enumerate a target process's memory regions to locate secret-bearing heap
    description: >-
      List a process's VM regions by pid or partial name to identify the malloc heap regions
      (MALLOC_TINY, MALLOC_SMALL, MALLOC_LARGE) holding runtime secrets before reading those ranges.
      The -s flag sorts regions by size to surface the largest allocations first.
    code: vmmap -s <TARGET_PROCESS_NAME>
    tactics:
      - Discovery
      - Credential Access
    tags: []
  - name: Locate securityd MALLOC_TINY regions to target the keychain master key
    description: >-
      The keychaindump technique runs "vmmap <pid>" against securityd, parses each
      "MALLOC_TINY <start>-<stop>" line for heap ranges, and scans them for the unlocked keychain
      master key (a 24-byte candidate preceded by an 8-byte 0x18 length field). Current SIP hardening
      blocks reading securityd even as root, so this is historical and research-only.
    code: vmmap <SECURITYD_PID> | grep MALLOC_TINY
    tactics:
      - Credential Access
    tags: []
  - name: Analyse an exfiltrated memory graph file offline
    description: >-
      vmmap accepts a ".memgraph" file (from leaks -outputGraph or the Xcode Memory Graph Debugger)
      instead of a pid or name. An attacker who captured a process memory graph reconstructs the
      target's region layout on another host, with no task port and no root. The -w flag shows full
      paths of mapped files.
    code: vmmap -w <TARGET>.memgraph
    tactics:
      - Collection
      - Discovery
    tags: []
  - name: Enumerate a process's mapped libraries to fingerprint loaded security tooling
    description: >-
      With the -w (wide) flag, vmmap prints the full filesystem paths of every mapped file in the
      target, including loaded dynamic libraries. An attacker reads these to identify security agents,
      injected dylibs or monitoring frameworks resident in a process. The same task-port prerequisite
      applies.
    code: vmmap -w <TARGET_PROCESS_NAME>
    tactics:
      - Discovery
    tags:
      - dylib
paths:
  - /usr/bin/vmmap
detections: []
