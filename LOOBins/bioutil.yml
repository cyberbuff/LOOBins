    url: https://keith.github.io/xcode-man-pages/bioutil.1.html
  - name: "Fleet: Using bioutil to verify Touch ID/biometric utilization"
    url: https://fleetdm.com/guides/using-bioutil-cmd
  - name: "macOS TouchID: how to force immediate password check"
    url: https://honeytreelabs.com/posts/macos-touchid-how-to-force-immediate-password-check/
