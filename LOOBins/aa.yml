name: aa
author: Hare Sudhan (@cyb3rbuff)
short_description: Archive, append, and extract directory trees using the native Apple Archive format.
full_description: >-
  aa is the command-line front end for the Apple Archive library and ships with macOS. It creates and
  unpacks Apple Archives (.aar/.yaa), the format used by system components such as software updates
  and the Signed System Volume, supporting several compression algorithms and a target-directory model
  similar to tar. An attacker can use it to compress and stage collected files for exfiltration or to
  unpack a delivered payload without dropping a third-party archiver.
created: 2026-09-20
example_use_cases:
  - name: Stage and compress collected data for exfiltration
    description: >-
      The archive subcommand walks a target directory and writes a single compressed Apple Archive.
      -a selects the compression algorithm and -d sets the source directory.
    code: aa archive -d /Users/<USER>/.stage -o /tmp/collected.aar -a lzfse
    tactics:
      - Collection
    tags: []
  - name: Extract a payload delivered as an Apple Archive
    description: >-
      The extract subcommand unpacks an archive into a target directory. -i names the archive
      and -d the directory to write into.
    code: aa extract -i /tmp/payload.aar -d /Users/<USER>/Library/.cache
    tactics:
      - Defense Evasion
    tags: []
  - name: Inspect an archive before unpacking it
    description: >-
      The list subcommand prints an archive's contents without extracting them, useful for confirming
      a staging archive captured the intended files. -v raises verbosity.
    code: aa list -i /tmp/collected.aar -v
    tactics:
      - Discovery
    tags: []
  - name: Append newly collected files to an existing staging archive
    description: >-
      The append subcommand adds the contents of a directory to an existing archive, letting an
      attacker grow a single staging archive as new material is gathered. -d sets the source directory.
    code: aa append -d /Users/<USER>/.stage/new -o /tmp/collected.aar
    tactics:
      - Collection
    tags: []
paths:
  - /usr/bin/aa
  - /usr/bin/yaa
detections: []
resources:
  - name: "aa(1) manual page"
    url: https://keith.github.io/xcode-man-pages/aa.1.html
  - name: "MITRE ATT&CK T1560.001: Archive Collected Data - Archive via Utility"
    url: https://attack.mitre.org/techniques/T1560/001/
  - name: "MITRE ATT&CK T1560: Archive Collected Data"
    url: https://attack.mitre.org/techniques/T1560/
